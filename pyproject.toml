[tool.ufbx]
name = "ufbx"
version = "0.0.5.post2"
description = "Python bindings for ufbx (gonchar fork — SPHERIC rotation + Node cycle segfault fix)"
license="MIT"
homepage="https://ufbx.github.io/"
documentation="https://ufbx.github.io/"
authors = ["Samuli Raivio <bqqbarbhg@gmail.com>"]

[tool.ufbx.dependencies]
python = "^3.9"

[build-system]
requires = ["setuptools", "wheel"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
skip = ["*-win32", "*-manylinux_i686", "pp*", "*-musllinux*"]

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"
